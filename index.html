<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LM Studio Connection Test</title>
</head>
<body style="text-align:center; font-family: Arial, sans-serif; margin-top: 50px;">
  <h1>LM Studio Connection Test</h1>
  <p>Testing connection to Cloudflare tunnel URL</p>
  
  <div id="status">Checking connection...</div>
  
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      try {
        const response = await fetch('https://peru-lightbox-tanzania-obituaries.trycloudflare.com/v1/models');
        const data = await response.json();
        document.getElementById('status').innerHTML = 
          '<div style="color:green; font-weight:bold;">CONNECTION SUCCESSFUL!</div>' +
          '<p>Found ' + data.data.length + ' models:</p>' +
          '<pre style="text-align:left; margin: 20px auto; max-width:500px; background:#f0f0f0; padding:20px; border-radius:5px; overflow:auto;">' + 
          JSON.stringify(data, null, 2) + 
          '</pre>';
      } catch (error) {
        document.getElementById('status').innerHTML = 
          '<div style="color:red; font-weight:bold;">CONNECTION FAILED</div>' +
          '<p>Error details:</p>' +
          '<pre style="text-align:left; margin: 20px auto; max-width:500px; background:#f0f0f0; padding:20px; border-radius:5px; overflow:auto;">' + 
          error.toString() + 
          '</pre>';
      }
    });
  </script>
</body>
</html>
